<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Diff 预览测试</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #222; }
    h1 { color: #2563eb; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px 20px; margin-top: 16px; }
    .tag { display: inline-block; background: #dbeafe; color: #1d4ed8; border-radius: 6px; padding: 2px 8px; font-size: 12px; }
    .big { font-size: 48px; }
  </style>
</head>
<body>
  <h1>Diff 预览测试 🎨</h1>
  <p>这是一个用于测试 diff 弹窗 HTML 预览的页面。默认应该直接看到本页渲染。</p>
  <div class="card">
    <span class="tag">改动后</span>
    <div class="big">🚀</div>
    <p>这是改动之后的新版本内容，应该出现在 Preview 里。</p>
    <button onclick="alert('脚本也能跑')">点我测脚本</button>
  </div>
</body>
</html>
